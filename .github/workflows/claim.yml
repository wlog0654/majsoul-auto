name: 雀魂月卡奖励
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *' # UTC 01:30 = Asia/Shanghai 09:30; GitHub may delay execution.
permissions:
  contents: read
concurrency:
  group: majsoul-month-ticket
  cancel-in-progress: false
jobs:
  claim:
    if: github.event_name == 'workflow_dispatch' || vars.MAJSOUL_AUTO_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: 安装官方版本资源解析工具
        run: |
          python3 -m venv .version-venv
          .version-venv/bin/python -m pip install --disable-pip-version-check --no-compile -r requirements-version.txt
      - name: 检查版本读取逻辑
        run: .version-venv/bin/python -m unittest discover -s test -p 'test_*.py'
      - name: 自动读取雀魂官方当前版本
        run: .version-venv/bin/python tools/resolve_version.py work/current-client-version.json
      - name: 登录并领取月卡奖励
        run: npm start
        env:
          MAJSOUL_VERSION_FILE: work/current-client-version.json
          MAJSOUL_EMAIL: ${{ secrets.MAJSOUL_EMAIL }}
          MAJSOUL_PASSWORD: ${{ secrets.MAJSOUL_PASSWORD }}
