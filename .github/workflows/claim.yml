name: 雀魂月卡奖励
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1,7 * * *' # Asia/Shanghai 09:30 and 15:30; best-effort delivery.
permissions:
  contents: read
concurrency:
  group: majsoul-month-ticket
  cancel-in-progress: false
jobs:
  schedule-status:
    name: 检查触发来源与定时开关
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
    steps:
      - name: 输出非敏感调度信息
        id: config
        env:
          AUTO_ENABLED: ${{ vars.MAJSOUL_AUTO_ENABLED == 'true' }}
          AUTO_PAUSED: ${{ vars.MAJSOUL_AUTO_ENABLED == 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          CRON_EXPRESSION: ${{ github.event.schedule }}
          RUN_ACTOR: ${{ github.actor }}
        run: |
          printf 'enabled=%s\n' "$AUTO_ENABLED" >> "$GITHUB_OUTPUT"
          {
            printf '### 触发与配置检查\n'
            printf -- '- 触发来源：%s\n' "$EVENT_NAME"
            printf -- '- cron：%s\n' "$CRON_EXPRESSION"
            printf -- '- 执行用户：%s\n' "$RUN_ACTOR"
            printf -- '- MAJSOUL_AUTO_ENABLED 是否为 true：%s\n' "$AUTO_ENABLED"
            printf -- '- 实际开始时间（UTC）：%s\n' "$(date -u '+%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT_NAME" = "schedule" ] && [ "$AUTO_ENABLED" != "true" ] && [ "$AUTO_PAUSED" != "true" ]; then
            echo "::error::定时开关缺失或值无效。请在 Repository Variables 设置 MAJSOUL_AUTO_ENABLED=true；明确暂停时填 false；不要放到 Secrets。"
            exit 1
          fi
  claim:
    needs: schedule-status
    if: github.event_name == 'workflow_dispatch' || needs.schedule-status.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: 安装官方版本资源解析工具
        run: |
          python3 -m venv .version-venv
          .version-venv/bin/python -m pip install --disable-pip-version-check --no-compile -r requirements-version.txt
      - name: 检查版本读取逻辑
        run: .version-venv/bin/python -m unittest discover -s test -p 'test_*.py'
      - name: 自动读取雀魂官方当前版本
        run: .version-venv/bin/python tools/resolve_version.py work/current-client-version.json
      - name: 登录并领取月卡奖励
        run: npm start
        env:
          MAJSOUL_VERSION_FILE: work/current-client-version.json
          MAJSOUL_EMAIL: ${{ secrets.MAJSOUL_EMAIL }}
          MAJSOUL_PASSWORD: ${{ secrets.MAJSOUL_PASSWORD }}
