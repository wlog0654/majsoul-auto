name: Bug report
description: 反馈部署、登录、版本解析或领取问题；请勿提供凭据。
title: '[问题] '
body:
  - type: markdown
    attributes:
      value: 请先阅读 README 排错说明。此 Issue 可能公开，勿填写账号、密码、密码哈希、令牌或原始网络抓包。
  - type: dropdown
    id: stage
    attributes:
      label: 问题发生在哪一步？
      options:
        - Fork 或启用 Actions
        - Secrets 或定时变量配置
        - 自动读取官方版本
        - 连接服务器
        - 登录
        - 月卡查询或领取
        - 每日调度或邮件通知
        - 其他
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: 运行的提交 SHA 或脱敏运行链接
      description: 可在 Actions 运行详情中查看。不要提供包含令牌的链接。
  - type: textarea
    id: logs
    attributes:
      label: 错误码、失败步骤及脱敏日志
      description: 可附自动读取出的资源和程序包版本；只复制相关几行，检查是否含敏感值。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
  - type: checkboxes
    id: scope
    attributes:
      label: 确认
      options:
        - label: 已确认账号可在 game.maj-soul.com/1/ 使用邮箱和密码直接登录。
        - label: 已检查内容，不含账号密码、令牌、密码哈希或完整网络抓包。
          required: true
